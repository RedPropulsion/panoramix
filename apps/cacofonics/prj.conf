CONFIG_DEBUG=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_ASYNC_API=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_GPIO=y
CONFIG_FPU=y
CONFIG_SPI=y
CONFIG_I2C=y

CONFIG_DMA=y
CONFIG_DMA_STM32=y

CONFIG_LORA=y
CONFIG_LORA_SX126X=y

CONFIG_TEST_RANDOM_GENERATOR=y

# ── GNSS subsystem ────────────────────────────────────────
CONFIG_GNSS=n

CONFIG_LED=y
CONFIG_LED_GPIO=y

# Aumentiamo la dimensione del buffer di log per poter stampare le stringhe GPS
CONFIG_LOG_BUFFER_SIZE=2048
