CONFIG_DEBUG=y
CONFIG_GPIO=y

CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_STM32=y

CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3

CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_FPU=y

CONFIG_ICM4268X_DECODER=y
CONFIG_ICM4268X_TRIGGER_GLOBAL_THREAD=y # probabilmente questo va abilitato
CONFIG_ICM4268X_TRIGGER_OWN_THREAD=n

#CONFIG_PRINTK=y
CONFIG_DMA=y
CONFIG_DCACHE=n

CONFIG_LED_STRIP=y
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y
CONFIG_UART_ASYNC_API=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# --- SOTTOSISTEMA LED ---
CONFIG_LED_STRIP=y

# --- ABILITAZIONE SERIALE E DMA BASE ---
CONFIG_SERIAL=y
CONFIG_DMA=y

# --- DRIVER SPECIFICI STM32 ---
CONFIG_UART_STM32=y
CONFIG_DMA_STM32=y

# --- API ASINCRONA (Richiesta dal WS2812) ---
CONFIG_UART_ASYNC_API=y

CONFIG_HEAP_MEM_POOL_SIZE=4096


# Attiva il supporto DMA e UART Asincrona
CONFIG_SERIAL=y
CONFIG_UART_ASYNC_API=y
