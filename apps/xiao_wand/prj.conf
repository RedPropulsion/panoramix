# configurazione per il modulo xiao esp32s3 con wio_sx1262 per la comunicazione LoRa
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_INPUT=y




# LoRa
CONFIG_LORA=y
CONFIG_LORA_INIT_PRIORITY=90
CONFIG_LORA_SX126X=y

CONFIG_MAVWRAP=y
CONFIG_MAVWRAP_DIALECT_NAME="common"

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y

CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
