description: Waveshare ST3215 serial bus servo motor

compatible: "waveshare,st3215"

include: base.yaml

properties:
  servo-id:
    type: int
    required: false
    default: 1
    description: Servo ID (1-253)
  speed:
    type: int
    required: false
    default: 0
    description: Goal speed (0=maximum, 1-4095=limited)
  time-ms:
    type: int
    required: false
    default: 0
    description: Goal time in milliseconds (0=use speed register)
